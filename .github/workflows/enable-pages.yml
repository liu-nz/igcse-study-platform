name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  contents: read
  pages: write
  administration: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages with workflow source
        run: |
          echo "=== Checking current Pages status ==="
          HTTP_CODE=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          echo "HTTP status: $HTTP_CODE"
          cat /tmp/pages.json
          echo ""
          if [ "$HTTP_CODE" = "404" ]; then
            echo "=== Pages not enabled, creating with workflow build type ==="
            CREATE_CODE=$(curl -s -o /tmp/create.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"build_type":"workflow"}')
            echo "Create HTTP status: $CREATE_CODE"
            cat /tmp/create.json
            echo ""
            if [ "$CREATE_CODE" = "201" ] || [ "$CREATE_CODE" = "200" ]; then
              echo "=== Pages enabled successfully! ==="
            else
              echo "=== Failed to enable Pages, trying legacy mode ==="
              curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/${{ github.repository }}/pages \
                -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}'
              echo ""
            fi
          else
            echo "=== Pages already exists ==="
          fi
